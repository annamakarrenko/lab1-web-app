{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto text-center">
        <h1 class="my-4">Счётчик посещений</h1>
        
        <div class="card">
            <div class="card-body">
                <p class="display-1">{{ visit_count }}</p>
                <p class="lead">раз(а) вы посетили эту страницу</p>
                <hr>
                <p class="text-muted">
                    Счётчик хранится в вашей сессии и обновляется при каждом посещении.
                </p>
                <a href="{{ url_for('visit_counter') }}" class="btn btn-primary">Обновить страницу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
