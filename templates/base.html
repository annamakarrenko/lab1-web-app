<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>{% if title %}{{ title }}{% else %}Лабораторная работа №2{% endif %}</title>
    <style>
      html {
        height: 100%;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="{{ url_for('index') }}">Лабораторная работа №2</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Задание</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('posts') }}">Посты</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">Об авторе</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('url_params') }}">URL параметры</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('headers') }}">Заголовки</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('cookies_page') }}">Cookie</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('form_params') }}">Параметры формы</a></li>
              <li class="nav-item"><a class="nav-link" href="{{ url_for('phone_form') }}">Проверка телефона</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="my-3">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>

    <footer class="bg-dark text-white mt-5 py-4">
      <div class="container text-center">
        <p class="mb-0">© 2026 Макаренко Анна Ефимовна | Группа: 241-372</p>
        <p class="mb-0 small">Все права защищены</p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
