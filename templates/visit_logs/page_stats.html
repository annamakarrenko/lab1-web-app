{% extends 'base.html' %}

{% block content %}
<div class="container">
    <h1 class="my-4"> Статистика посещений по страницам</h1>
    
    <div class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
                <tr><th>№</th><th>Страница</th><th>Количество посещений</th></tr>
            </thead>
            <tbody>
                {% for stat in stats %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td><code>{{ stat.path }}</code></td>
                    <td>{{ stat.count }}</td>
                </tr>
                {% else %}
                <tr><td colspan="3" class="text-center">Нет данных</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    
    <div class="mt-4">
        <a href="{{ url_for('visit_logs.export_page_stats') }}" class="btn btn-success"> Экспорт в CSV</a>
        <a href="{{ url_for('visit_logs.index') }}" class="btn btn-secondary">← Назад к журналу</a>
    </div>
</div>
{% endblock %}
